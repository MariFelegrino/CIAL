<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Demo Calendar | budati.com</title>

    <!-- Bootstrap v4.3.1  -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous"> -->
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/fonts.css">
        <link rel="stylesheet" href="css/calendario.css">
        <link rel="stylesheet" href="css/alertasCIAL.css">

    <style>
        /* demo: centra el contenido del index */
        .page-center {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>

<body class="bg-white">
    <!-- Header: micro menú -->
    <header class="border-bottom bg-light">
        <div class="container">
            <nav class="navbar navbar-expand p-0" style="min-height:56px;">
                <ul class="navbar-nav mx-auto flex-row">
                    <li class="nav-item px-2">
                        <a class="nav-link text-dark" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link text-dark" href="grupos.html">Grupos</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link font-weight-bold text-dark" href="reserva.html">Reserva</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contenido (solo index) -->
    <!-- Contenido (reserva) -->
    <main class="py-4">
        <div class="container">
            <div class="row">
                <!-- LEFT: selector -->
                <div class="col-12 col-lg-3 mb-3 mb-lg-0">
                    <div class="card">
                        <div class="card-header bg-white">
                            <strong>Selecciona grupo</strong>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="selGrupoReserva" class="mb-1">Grupo</label>
                                <select id="selGrupoReserva" class="form-control">
                                    <option value="0">-- Selecciona --</option>
                                </select>
                                <i class="d-block"></i>
                                <small class="text-muted d-block mt-2">Se marcarán los días con sesiones de 2
                                    horas.</small>
                            </div>

                            <hr>

                            <div id="reservaInfo" class="small text-muted">
                                Selecciona un grupo para ver disponibilidad.
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: calendario -->
                <div class="col-12 col-lg-9">
                    <div class="card">
                        <div class="card-header bg-white d-flex align-items-center justify-content-between">
                            <div>
                                <strong id="calTitle">Calendario</strong>
                                <div class="small text-muted" id="calSubtitle"></div>
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-outline-secondary"
                                    id="btnCalPrev">Anterior</button>
                                <button type="button" class="btn btn-outline-secondary" id="btnCalToday">Hoy</button>
                                <button type="button" class="btn btn-outline-secondary"
                                    id="btnCalNext">Siguiente</button>
                            </div>
                        </div>

                        <div class="card-body p-2">
                            <div id="calRoot" class="table-responsive"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- scripts -->
    <script src="scripts/sweetalert.js"></script>
    <script src="scripts/jquery-3.7.1.min.js"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>

    <script src="scripts/cial-calendario.js"></script>

</body>
</html>
