<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .spotify-player {
  padding: 1rem;
  background: #1e3545;
}

.spotify-player iframe {
  width: 100%;
}

    </style>

    <section class="sound-block">
  <div class="sound-block__content">
    <span class="eyebrow">VIBRACIONES QUE ELEVAN</span>

    <h2>Escucha la armonía del universo</h2>

    <p>
      Una pequeña colección de sonidos, mantras y melodías que acompañan
      la meditación y la introspección.
    </p>

    <a
      href="https://open.spotify.com/playlist/XXXXXXXX"
      target="_blank"
      class="link-arrow"
    >
      Ver playlist →
    </a>
  </div>

  <div class="sound-block__media">
    <div
      class="media-image"
      style="background-image:url('flor.webp');"
    ></div>

    <div class="spotify-player">
      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/album/6MRvPbmvRXntgB8DiDsIT6"
        width="100%"
        height="80"
        frameBorder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </div>
</section>

</body>
</html>
